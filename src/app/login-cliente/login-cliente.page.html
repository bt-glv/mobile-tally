<ion-content [fullscreen]="true" class="login-cliente-content">
  <div class="login-container">
    <div class="brand-section">
      <h1 class="app-title">Tally</h1>
    </div>

    <div class="actions-section">
      <ion-button expand="block" class="google-button" (click)="entrarComGoogle()">
        <ion-icon name="logo-google" slot="start"></ion-icon>
        Entrar com Google
      </ion-button>

      <ion-button expand="block" class="seller-button" (click)="irParaVendedor()">
        <ion-icon name="storefront" slot="start"></ion-icon>
        Sou Vendedor
      </ion-button>
    </div>
  </div>
</ion-content>
