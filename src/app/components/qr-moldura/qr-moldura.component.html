<div class="moldura">
  <svg class="moldura-borda" aria-hidden="true">
    <rect
      width="100%"
      height="100%"
      rx="26"
      ry="26"
      fill="none"
      stroke="currentColor"
      stroke-width="8"
      stroke-dasharray="20 12"
    />
  </svg>
  <div class="qr-placa">
    <qrcode
      [qrdata]="conteudo()"
      [width]="tamanho()"
      [margin]="0"
      errorCorrectionLevel="M"
      elementType="svg"
      colorDark="#000000"
      colorLight="#ffffff"
    ></qrcode>
  </div>
</div>
